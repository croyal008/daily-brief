name: Voice samples

on:
  workflow_dispatch: {}   # run by hand to compare Azure voices

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet soundfile numpy
      - name: Record samples
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python scripts/voice_samples.py
      - name: Save them
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/samples
          git diff --cached --quiet && exit 0
          git commit -m "Voice samples"
          git pull --rebase
          git push
