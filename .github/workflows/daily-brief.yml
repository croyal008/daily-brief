name: Daily brief

on:
  schedule:
    # Every day at 10:15 UTC = 4:15 AM Central (5:15 AM during daylight time).
    - cron: "15 10 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet "anthropic>=2.13" kokoro-onnx soundfile

      - name: Build today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          BRIEF_TIMEZONE: ${{ vars.BRIEF_TIMEZONE }}
        run: python scripts/build_brief.py

      # The podcast voice (Kokoro, free and open source). The model files are downloaded
      # once and then reused from GitHub's cache.
      - name: Get the podcast voice
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download the podcast voice
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Record the podcast
        continue-on-error: true   # if this fails, the written brief still goes out
        env:
          KOKORO_DIR: models
        run: python scripts/podcast.py

      - name: Save it
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if [ -d docs/audio ]; then git add docs/audio; fi
          git diff --cached --quiet && exit 0
          git commit -m "Brief for $(date -u +%Y-%m-%d)"
          git push
