name: Daily brief

on:
  schedule:
    # Every day at 10:15 UTC = 4:15 AM Central (5:15 AM during daylight time).
    - cron: "15 10 * * *"
  workflow_dispatch:      # lets you run it by hand from the Actions tab
    inputs:
      podcast:
        description: "Record a new podcast episode too"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet "anthropic>=2.13" kokoro-onnx soundfile

      - name: Build today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          BRIEF_TIMEZONE: ${{ vars.BRIEF_TIMEZONE }}
        run: python scripts/build_brief.py

      - name: Add the weather
        continue-on-error: true
        run: python scripts/weather.py

      # The podcast voice (Kokoro, free and open source). The model files are downloaded
      # once and then reused from GitHub's cache.
      - name: Get the podcast voice
        if: github.event_name != 'workflow_dispatch' || inputs.podcast
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download the podcast voice
        if: (github.event_name != 'workflow_dispatch' || inputs.podcast) && (steps.voice-cache.outputs.cache-hit != 'true')
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Record the podcast
        if: github.event_name != 'workflow_dispatch' || inputs.podcast
        continue-on-error: true   # if this fails, the written brief still goes out
        env:
          KOKORO_DIR: models
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          PODCAST_MODEL: ${{ vars.PODCAST_MODEL }}
        run: python scripts/podcast.py

      # Keep only today's episode: upload it to the "podcast" release, then delete older ones.
      # (Audio is kept out of the project's history so storage never grows.)
      - name: Publish the podcast
        if: github.event_name != 'workflow_dispatch' || inputs.podcast
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls build/brief-*.mp3 >/dev/null 2>&1 || { echo "No recording today"; exit 0; }
          new=$(basename build/brief-*.mp3)
          gh release view podcast >/dev/null 2>&1 || \
            gh release create podcast --title "Daily podcast" --latest=false \
              --notes "Today's recorded brief. Replaced every morning; only the newest episode is kept."
          gh release upload podcast "build/$new" --clobber
          for old in $(gh release view podcast --json assets -q '.assets[].name'); do
            if [ "$old" != "$new" ]; then gh release delete-asset podcast "$old" -y; fi
          done
          # iPhones won't play release downloads, so also put the episode alone on the "audio" branch
          # (replaced each day, no history) and play it through the jsDelivr CDN, which serves it as audio.
          rm -rf /tmp/audio && mkdir /tmp/audio && cp "build/$new" /tmp/audio/
          git -C /tmp/audio init -q -b audio
          git -C /tmp/audio add .
          git -C /tmp/audio -c user.name="daily-brief-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Today's podcast"
          git -C /tmp/audio push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" audio
          sha=$(git -C /tmp/audio rev-parse HEAD)
          python3 - "$sha" "$new" <<'PY'
          import json, os, sys
          sha, name = sys.argv[1], sys.argv[2]
          p = "build/audio.json"
          a = json.load(open(p))
          a["backup_url"] = a["url"]
          a["url"] = f"https://cdn.jsdelivr.net/gh/{os.environ['GITHUB_REPOSITORY']}@{sha}/{name}"
          json.dump(a, open(p, "w"), ensure_ascii=False, indent=1)
          PY
          cp build/audio.json docs/data/audio.json

      - name: Save it
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Brief for $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push
